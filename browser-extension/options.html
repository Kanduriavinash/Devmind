<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevMind extension settings</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { max-width: 620px; margin: 48px auto; padding: 0 24px; }
    h1 { margin-bottom: 8px; }
    p { opacity: .78; }
    label { display: block; margin: 24px 0 8px; font-weight: 650; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #8886; border-radius: 10px; font: inherit; }
    button { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 9px; background: #c23c81; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>DevMind extension</h1>
  <p>Choose the DevMind page to open when you click the extension. For local use, start the app at <code>http://localhost:8501</code>.</p>
  <form id="settings-form">
    <label for="app-url">DevMind page URL</label>
    <input id="app-url" name="app-url" type="url" required>
    <button type="submit">Save settings</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="options.js"></script>
</body>
</html>
